[package]
name = "totan"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi"] }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
httparse = { workspace = true }
socket2 = { workspace = true }
boa_engine = { workspace = true }
boa_gc = { workspace = true }
glob = { workspace = true }
lru = { workspace = true }
once_cell = { workspace = true }
totan-common = { path = "../totan-common" }

# eBPF userspace loader dependencies.
aya = { workspace = true }
aya-log = { workspace = true }
libc = "0.2"

http = "1.3"
pingora = { version = "0.8.0", features = ["proxy"] }
async-trait = "0.1"

# `aya-build` drives the bpfel-unknown-none compile of `totan-ebpf` from
# `build.rs`.
[build-dependencies]
aya-build = { workspace = true }

[dev-dependencies]
tempfile = "3"
