name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Check, Test & Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            rust_arch: x86_64
          - arch: arm64
            runner: ubuntu-26.04-arm
            rust_arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - name: Install nightly-2026-10-18 for the eBPF crate
        run: rustup toolchain install nightly-2026-10-18 --component rust-src --profile minimal --no-self-update

      - name: Cache bpf-linker
        id: cache-bpf-linker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/bpf-linker
          key: bpf-linker-${{ runner.os }}-${{ matrix.rust_arch }}-v0.11.0

      - name: Install bpf-linker
        if: steps.cache-bpf-linker.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-${{ matrix.rust_arch }}-unknown-linux-musl.tar.zst
          tar -xpf /tmp/bpf-linker.tar.zst -C ~/.cargo/bin
          bpf-linker --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --locked --workspace --exclude totan-ebpf
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude totan-ebpf --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --exclude totan-ebpf
      - name: Build release binary
        run: cargo build --locked -p totan --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: totan-release-${{ matrix.arch }}
          path: target/release/totan
          retention-days: 1

  e2e:
    name: E2E (eBPF, PAC routing)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: totan-release-amd64
          path: target/release/
      - name: Make totan executable
        run: chmod +x target/release/totan
      - name: Verify kernel version
        run: |
          echo "kernel: $(uname -r)"
          uname -r | awk -F. '{exit !(($1 > 6) || ($1 == 6 && $2 >= 6))}'
      - name: Run eBPF e2e
        run: sudo --preserve-env=PATH bash toolkit/e2e/run.sh
