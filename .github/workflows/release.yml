name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    name: Release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # create the release and upload its assets
    strategy:
      fail-fast: false
      # The first leg creates the release, the second adds its asset to it.
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            rust_arch: x86_64
          - arch: arm64
            runner: ubuntu-26.04-arm
            rust_arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.rust_arch }}-unknown-linux-musl

      - name: Install nightly-2026-08-26 for the eBPF crate
        run: rustup toolchain install nightly-2026-08-26 --component rust-src --profile minimal --no-self-update

      - name: Install build dependencies
        # musl-tools links the userspace binaries against musl; cmake and zstd
        # are needed by the libz-ng-sys build script and by the bpf-linker
        # archive.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake musl-tools zstd

      - name: Install bpf-linker
        run: |
          curl -fsSL -o /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-${{ matrix.rust_arch }}-unknown-linux-musl.tar.zst
          tar -xpf /tmp/bpf-linker.tar.zst -C ~/.cargo/bin
          bpf-linker --version

      - name: Build
        run: |
          cargo build --locked --release \
            --target ${{ matrix.rust_arch }}-unknown-linux-musl \
            -p totan -p totan-vminit

      - name: Package
        id: package
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.rust_arch }}-unknown-linux-musl
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="totan-${version}-linux-${ARCH}.tar.gz"
          stage="$(mktemp -d)"
          install -Dm755 "target/${TARGET}/release/totan" "${stage}/totan"
          install -Dm755 "target/${TARGET}/release/totan-vminit" "${stage}/totan-vminit"
          install -Dm644 systemd/totan.service "${stage}/systemd/totan.service"
          install -Dm644 config/config.example.toml "${stage}/config/config.example.toml"
          tar -czf "${archive}" -C "${stage}" totan totan-vminit systemd config
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "$ARCHIVE"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: totan-${{ matrix.arch }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 1

  init-image:
    name: Init image for apple/container
    runs-on: ubuntu-26.04-arm
    needs: release
    permissions:
      contents: read
      packages: write # push the init image to ghcr
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: totan-arm64
          path: /tmp/release

      - name: Stage the arm64 binaries in the build context
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -xzf "/tmp/release/totan-${version}-linux-arm64.tar.gz" \
            -C contrib/apple-container totan totan-vminit

      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/matchascript/totan-init:${GITHUB_REF_NAME#v}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -f contrib/apple-container/Containerfile -t "$image" contrib/apple-container
          docker push "$image"
